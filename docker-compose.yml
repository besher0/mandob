services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandob
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mandob
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandob -d mandob"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - mandob_pg_data:/var/lib/postgresql/data
volumes:
  mandob_pg_data:
